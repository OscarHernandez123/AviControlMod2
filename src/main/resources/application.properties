spring.application.name=avicontrol-modulo-2
spring.datasource.url=${AVICONTROL_DB_URL}
spring.datasource.username=${AVICONTROL_DB_USERNAME}
spring.datasource.password=${AVICONTROL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
management.endpoint.health.probes.enabled=true

avicontrol.security.admin-password=${AVICONTROL_ADMIN_PASSWORD}
avicontrol.security.nutricionista-password=${AVICONTROL_NUTRICIONISTA_PASSWORD}
avicontrol.security.trabajador-password=${AVICONTROL_TRABAJADOR_PASSWORD}
avicontrol.security.usuario-password=${AVICONTROL_USUARIO_PASSWORD}
