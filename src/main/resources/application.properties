spring.application.name=avicontrol-modulo-2
spring.profiles.default=local

spring.datasource.url=${AVICONTROL_DB_URL:jdbc:postgresql://localhost:5432/avicontrol_modulo2}
spring.datasource.username=${AVICONTROL_DB_USERNAME:avicontrol}
spring.datasource.password=${AVICONTROL_DB_PASSWORD:avicontrol}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

avicontrol.inventario.capacidad-maxima-kg=${AVICONTROL_BODEGA_CAPACIDAD_KG:0}

avicontrol.inventario.ocupacion-actual-kg=${AVICONTROL_BODEGA_OCUPACION_KG:-1}

# Credenciales temporales de desarrollo. Reemplazar por el módulo de identidad compartido.
avicontrol.security.bootstrap.admin.username=${AVICONTROL_ADMIN_USERNAME:admin}
avicontrol.security.bootstrap.admin.password=${AVICONTROL_ADMIN_PASSWORD:admin123}
avicontrol.security.bootstrap.veterinario.username=${AVICONTROL_VETERINARIO_USERNAME:veterinario}
avicontrol.security.bootstrap.veterinario.password=${AVICONTROL_VETERINARIO_PASSWORD:veterinario123}
avicontrol.security.bootstrap.trabajador.username=${AVICONTROL_TRABAJADOR_USERNAME:trabajador}
avicontrol.security.bootstrap.trabajador.password=${AVICONTROL_TRABAJADOR_PASSWORD:trabajador123}
avicontrol.security.bootstrap.nutricionista.username=${AVICONTROL_NUTRICIONISTA_USERNAME:nutricionista}
avicontrol.security.bootstrap.nutricionista.password=${AVICONTROL_NUTRICIONISTA_PASSWORD:nutricionista123}
