# Activar con SPRING_PROFILES_ACTIVE=modulo1-rest (sin local ni test).
# URL del servidor, sin /api/v1. Obligatoria para evitar conexiones accidentales.
avicontrol.modulo1.rest.base-url=${AVICONTROL_MODULO1_BASE_URL}
avicontrol.modulo1.rest.connect-timeout=${AVICONTROL_MODULO1_CONNECT_TIMEOUT:2s}
avicontrol.modulo1.rest.read-timeout=${AVICONTROL_MODULO1_READ_TIMEOUT:5s}

# Kafka: Spring Boot también permite configurar esta propiedad con SPRING_KAFKA_BOOTSTRAP_SERVERS.
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
avicontrol.modulo1.kafka.outbox-delay-ms=${AVICONTROL_MODULO1_OUTBOX_DELAY_MS:1000}

avicontrol.modulo1.asincrono=true
