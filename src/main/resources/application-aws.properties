# Requiere activar aws,modulo1-rest. Sin valores de desarrollo para la BD ni las contraseñas.
spring.datasource.url=${AVICONTROL_DB_URL}
spring.datasource.username=${AVICONTROL_DB_USERNAME}
spring.datasource.password=${AVICONTROL_DB_PASSWORD}
avicontrol.security.bootstrap.admin.password=${AVICONTROL_ADMIN_PASSWORD}
avicontrol.security.bootstrap.veterinario.password=${AVICONTROL_VETERINARIO_PASSWORD}
avicontrol.security.bootstrap.trabajador.password=${AVICONTROL_TRABAJADOR_PASSWORD}
avicontrol.security.bootstrap.nutricionista.password=${AVICONTROL_NUTRICIONISTA_PASSWORD}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}
server.address=0.0.0.0
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
